
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      npm:
        patterns:
          - "*"
    open-pull-requests-limit: 1
    versioning-strategy: increase-if-necessary

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 1
    versioning-strategy: increase-if-necessary
